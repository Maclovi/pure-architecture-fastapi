x-default: &default
  restart: unless-stopped
  networks:
    - overlay

x-healthcheck-interval: &hc-interval
  interval: 30s
  timeout: 60s
  retries: 5
  start_period: 10s

x-db-environment: &x-db-environment
  POSTGRES_SSL_MODE: "disable"
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_DB: test
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_USER: ${POSTGRES_USER}

x-api-environment: &x-api-environment
  SQLALCHEMY_DEBUG: ${SQLALCHEMY_DEBUG}
  UVICORN_HOST: ${UVICORN_HOST}
  UVICORN_PORT: ${UVICORN_PORT}

services:
  db:
    <<: *default
    container_name: cats.db
    hostname: cats.db
    image: postgres:alpine
    environment:
      <<: *x-db-environment
    ports:
      - ${POSTGRES_HOST}:${POSTGRES_PORT}:${POSTGRES_PORT}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      <<: *hc-interval

  api:
    <<: *default
    container_name: cats.api
    hostname: cats.api
    build:
      context: .
      dockerfile: ./deploy/cats/Dockerfile
    environment:
      <<: [*x-db-environment, *x-api-environment]
      POSTGRES_HOST: db
    command: /bin/sh -cx "./server.sh"
    ports:
      - 127.0.0.1:${UVICORN_PORT}:${UVICORN_PORT}
    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsSL http://localhost:${UVICORN_PORT}/healthcheck"]
      <<: *hc-interval

  nginx:
    <<: *default
    container_name: cats.nginx
    hostname: cats.nginx
    image: nginx:stable-alpine
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - api
      - db

volumes:
  postgres:

networks:
  overlay:
    driver: bridge
