name: Build and Push Docker Image to GHCR

on:
  # pull_request:
  #   branches:
  #     - develop
  #     - main
  #   types: [closed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment (stage or prod)"
        required: true
        default: "stage"

env:
  # ---- common settings ----
  ENVIRONMENT_SUFFIX: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || 'stage') }}

  # ---- registry settings ----
  REGISTRY: ${{ vars.REGISTRY }}
  REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}

  # ---- image settings ----
  WEBCAT_IMAGE: ${{ vars.REGISTRY }}/${{ github.repository_owner }}/webcat

defaults:
  run:
    working-directory: .

jobs:
  build_and_push_images:
    name: Building and uploading images to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: ${{ env.ENVIRONMENT_SUFFIX }}

    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ env.REGISTRY_PAT }}

      - name: Building and loading the webcat image
        if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/webcat/Dockerfile
          push: true
          tags: |
            ${{ env.WEBCAT_IMAGE }}:${{ env.ENVIRONMENT_SUFFIX }}
            ${{ env.WEBCAT_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_PATH }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PATH }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
