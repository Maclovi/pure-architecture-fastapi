---
services:
  postgres:
    image: postgres:alpine
    restart: unless-stopped
    env_file: ".env"
    environment:
      - POSTGRES_DB=test
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres:/data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-backend:
    build: .
    restart: always
    env_file: ".env"
    environment:
      - POSTGRES_HOST=postgres
      - UVICORN_HOST=0.0.0.0
    command: just run
    ports:
      - 127.0.0.1:${UVICORN_PORT}:${UVICORN_PORT}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
